name: BPM Testing Framework CI

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Set Maven version
        run: |
          # Extract base version from pom.xml
          POM_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          
          # Determine version suffix based on branch
          if [[ "${{ github.ref_name }}" == develop* ]]; then
            ARTIFACT_VERSION="${POM_VERSION}-b${{ github.run_number }}"
          elif [[ "${{ github.ref_name }}" == release* ]]; then
            ARTIFACT_VERSION="${POM_VERSION}-rc${{ github.run_number }}"
          else
            ARTIFACT_VERSION="${POM_VERSION}-SNAPSHOT"
          fi
          echo "Setting version to: ${ARTIFACT_VERSION}"
          mvn versions:set -DnewVersion=${ARTIFACT_VERSION}

      - name: Build with Maven
        run: |
          mvn clean install \
            -DignoreCoverageFailure=true \
            -DskipCoverage=false
        env:
          MAVEN_OPTS: "-Xmx1024m"
