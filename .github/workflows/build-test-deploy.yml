name: "Build CI"

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
  CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('ci-default-branch-{0}-{1}', github.sha, github.workflow) ||
    format('ci-pr-{0}-{1}', github.ref, github.workflow) }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  actions: read
  pull-requests: write
  attestations: write
  id-token: write

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    outputs:
      image_version: ${{ steps.version.outputs.image_version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Java setup
        uses: ./.github/actions/java-setup

      - name: Configure git
        uses: ./.github/actions/configure-git

      - name: Download deps and plugins
        run: mvn de.qaware.maven:go-offline-maven-plugin:resolve-dependencies -s ./settings.xml

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Set Maven version
        run: |
          # Extract base version from pom.xml
          POM_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          
          # Determine version suffix based on branch
          if [[ "${{ github.ref_name }}" == main* ]]; then
            ARTIFACT_VERSION="${POM_VERSION}-b${{ github.run_number }}"
          elif [[ "${{ github.ref_name }}" == release* ]]; then
            ARTIFACT_VERSION="${POM_VERSION}-rc${{ github.run_number }}"
          else
            ARTIFACT_VERSION="${POM_VERSION}-SNAPSHOT"
          fi
          echo "Setting version to: ${ARTIFACT_VERSION}"
          mvn versions:set -DnewVersion=${ARTIFACT_VERSION}

      - name: Build with Maven
        run: |
          mvn -B clean test verify \
            -DskipCoverage=false
        env:
          MAVEN_OPTS: "-Xmx1024m"

      - name: Deploy to GitHub Packages
        if: inputs.deploy-target == 'github'
        run: |
          mvn -B deploy -DaltDeploymentRepository=ossrh::https://maven.pkg.github.com/${{ github.repository }} \ 
            -DskipTests=true -s ./settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Maven Central
        if: inputs.deploy-target == 'central'
        run:
          mvn -B -U deploy -DskipTests=true -s ./settings.xml
        env:
          CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
          CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
          CI_GPG_PASSPHRASE: ${{ secrets.CI_GPG_PASSPHRASE }}
